apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shopstack-dev
resources:
  - namespace.yaml
  - ../../base

# Dev-only secret. For prod use External Secrets Operator + AWS Secrets Manager.
secretGenerator:
  - name: postgres-credentials
    literals:
      - password=dev-only-change-me

# The CD pipeline rewrites these with `kustomize edit set image` on every deploy.
images:
  - name: shopstack/frontend
    newName: shopstack/frontend
    newTag: latest
  - name: shopstack/product-service
    newName: shopstack/product-service
    newTag: latest
  - name: shopstack/order-service
    newName: shopstack/order-service
    newTag: latest
