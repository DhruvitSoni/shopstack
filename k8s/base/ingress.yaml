apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopstack
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/products
            pathType: Prefix
            backend: { service: { name: product-service, port: { number: 8000 } } }
          - path: /api/orders
            pathType: Prefix
            backend: { service: { name: order-service, port: { number: 3000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
