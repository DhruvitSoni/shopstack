# Infrastructure pipeline: plan on PRs (posted as a comment), apply on merge to main.
# Uses a separate, more privileged OIDC role (terraform output terraform_role_arn).
# Required: Secret TF_ROLE_ARN, Secret TF_STATE_BUCKET, Secret GRAFANA_ADMIN_PASSWORD, Variable AWS_REGION
name: Terraform

on:
  pull_request:
    paths: ["terraform/**"]
  push:
    branches: [main]
    paths: ["terraform/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_github_repo: ${{ github.repository }}
  TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform/envs/dev } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform fmt -check -recursive ../../
      - run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
      - run: terraform validate
      - id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env: { PLAN: "${{ steps.plan.outputs.stdout }}" }
        with:
          script: |
            const body = "### Terraform plan (dev)\n```\n" + process.env.PLAN.slice(-60000) + "\n```";
            github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false tfplan
