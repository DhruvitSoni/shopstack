# CI: runs on every pull request and push. Tests, lints, builds images, scans for vulnerabilities.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/product-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/product-service/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  order-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/order-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: services/order-service/package-lock.json }
      - run: npm ci
      - run: npm test

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for dir in k8s/overlays/dev k8s/overlays/prod monitoring; do
            kubectl kustomize "$dir" | ./kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  build-and-scan:
    needs: [product-service, order-service]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, product-service, order-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
