<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShopStack</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #1f2933; }
    h1 { margin-bottom: .25rem; } .sub { color: #616e7c; margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0 2rem; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #e4e7eb; }
    button { padding: .35rem .8rem; border: 0; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; }
    #msg { min-height: 1.5rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1>ShopStack</h1>
  <p class="sub">Industrial supplies demo — frontend → product-service + order-service</p>
  <div id="msg"></div>
  <h2>Products</h2>
  <table><thead><tr><th>Name</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody id="products"></tbody></table>
  <h2>Recent orders</h2>
  <table><thead><tr><th>#</th><th>Product</th><th>Qty</th><th>Total</th><th>Time</th></tr></thead><tbody id="orders"></tbody></table>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load() {
  const [products, orders] = await Promise.all([
    fetch('/api/products').then((r) => r.json()),
    fetch('/api/orders').then((r) => r.json()),
  ]);
  $('products').innerHTML = products.map((p) =>
    `<tr><td>${esc(p.name)}</td><td>$${p.price.toFixed(2)}</td><td>${p.stock}</td>
     <td><button onclick="buy(${p.id})">Buy</button></td></tr>`).join('');
  $('orders').innerHTML = orders.map((o) =>
    `<tr><td>${o.id}</td><td>${esc(o.productName)}</td><td>${o.qty}</td><td>$${o.total}</td>
     <td>${new Date(o.createdAt).toLocaleTimeString()}</td></tr>`).join('');
}

async function buy(productId) {
  const r = await fetch('/api/orders', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ productId, qty: 1 }),
  });
  const body = await r.json();
  $('msg').textContent = r.ok ? `Order #${body.id} placed` : `Error: ${body.error}`;
  load();
}
load();
</script>
</body>
</html>
