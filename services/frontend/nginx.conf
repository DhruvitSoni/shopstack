# Serves the static UI. In docker-compose this also proxies /api/* to the services;
# in Kubernetes the Ingress does that routing instead (same paths, so the UI is unchanged).
server {
  listen 8080;
  root /usr/share/nginx/html;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location /api/products { proxy_pass http://${PRODUCT_HOST}; }
  location /api/orders   { proxy_pass http://${ORDER_HOST}; }

  location / { try_files $uri /index.html; }
}
