global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: product-service
    static_configs:
      - targets: ["product-service:8000"]
  - job_name: order-service
    static_configs:
      - targets: ["order-service:3000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
