# kubectl apply -k monitoring/
# Ships our alert rules and Grafana dashboard into the cluster's kube-prometheus-stack.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - k8s/prometheus-rules.yaml
configMapGenerator:
  - name: shopstack-dashboard
    files:
      - grafana/dashboards/shopstack-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
